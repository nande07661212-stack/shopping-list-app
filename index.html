<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
  <title>쇼핑리스트</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>쇼핑리스트</h1>
      <p class="app__summary" id="summary">항목 0개</p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <input
        class="add-form__input"
        id="item-input"
        type="text"
        name="item"
        placeholder="살 것을 입력하세요"
        maxlength="80"
        aria-label="살 항목"
        required
      />
      <button class="add-form__button" type="submit">추가</button>
    </form>

    <ul class="list" id="list" aria-live="polite"></ul>

    <p class="empty" id="empty" hidden>아직 항목이 없습니다. 위에서 추가해 보세요.</p>

    <footer class="app__footer">
      <button class="link-button" id="clear-checked" type="button" hidden>
        체크한 항목 비우기
      </button>
    </footer>
  </main>

  <template id="item-template">
    <li class="list__item">
      <label class="list__label">
        <input class="list__checkbox" type="checkbox" />
        <span class="list__text"></span>
      </label>
      <button class="list__edit" type="button" aria-label="수정">&#9998;</button>
      <button class="list__delete" type="button" aria-label="삭제">&times;</button>
    </li>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase 프로젝트 설정 (publishable/anon 키는 클라이언트에 노출되어도 안전합니다 — RLS로 보호됨)
    window.SUPABASE_URL = "https://ahhiklbbadaxklwqizgz.supabase.co";
    window.SUPABASE_ANON_KEY = "sb_publishable_9eGTgdDECcIcU48DcqdHxQ_4j9BEzxB";
  </script>
  <script src="app.js" defer></script>
</body>
</html>
